services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + ML + APScheduler in Docker)
  # -------------------------------------------------------------
  - type: web
    name: serenity-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set manually in Render Dashboard under Environment
      - key: SECRET_KEY
        generateValue: true # Generates a secure random 32-character key automatically
      - key: DATABASE_URL
        fromDatabase:
          name: serenity-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: serenity-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: serenity-backend
          property: host

databases:
  # -------------------------------------------------------------
  # 3. PostgreSQL Database
  # -------------------------------------------------------------
  - name: serenity-db
    plan: free
    databaseName: serenity
    user: postgres
    region: oregon
